<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape Exploration</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shape Exploration</title>
<link rel="stylesheet" href="modernist.css">
<style>
html,body{margin:0;height:100%;overscroll-behavior:none}
a{color:var(--color-accent)}a:hover{color:var(--color-accent-700)}
</style>
</helmet>
<div style="display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--color-bg);font-family:var(--font-body);user-select:none;-webkit-user-select:none">
  <header style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--color-divider)">
    <div style="flex:1;min-width:0">
      <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);font-weight:600;margin-bottom:1px">Research exercise</div>
      <h1 style="font-size:16px;margin:0;line-height:1.15">Shape Exploration</h1>
    </div>
    <button class="btn btn-icon btn-secondary" onClick="{{ undo }}" disabled="{{ noUndo }}" aria-label="Undo" style="width:44px;height:44px;flex:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
    </button>
    <button class="btn btn-icon btn-secondary" onClick="{{ redo }}" disabled="{{ noRedo }}" aria-label="Redo" style="width:44px;height:44px;flex:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg>
    </button>
  </header>
  <div ref="{{ trayRef }}" style="position:relative;border-bottom:2px solid var(--color-divider);background:var(--color-surface)">
    <div style="display:flex;gap:10px;padding:12px 16px 8px">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="3">
        <div onPointerDown="{{ t.onDown }}" style="flex:none;width:68px;height:68px;display:flex;align-items:center;justify-content:center;background:var(--color-neutral-100);border:1px solid var(--color-divider);touch-action:none;cursor:grab" style-active="background:var(--color-accent-100);border-color:var(--color-accent)">
          <svg viewBox="-105 -105 210 210" width="48" height="48" style="pointer-events:none"><path d="{{ t.d }}" fill="none" stroke="var(--color-text)" stroke-width="9" stroke-linejoin="round"></path></svg>
        </div>
      </sc-for>
      <button onClick="{{ togglePen }}" aria-label="Pen tool" style="flex:none;width:68px;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:{{ penTileBg }};border:1px solid {{ penTileBorder }};color:{{ penTileFg }};cursor:pointer;padding:0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 19 12 22 15 15 22 12 19Z"></path><path d="M18 13 16.5 5.5 2 2l3.5 14.5L13 18l5-5Z"></path><path d="m2 2 7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
        <span style="font-family:var(--font-heading);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase">Pen</span>
      </button>
    </div>
    <div style="font-size:11px;padding:0 16px 8px;color:var(--color-neutral-600)">{{ hint }}</div>
    <sc-if value="{{ overTray }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--color-accent-100);border:2px solid var(--color-accent);pointer-events:none;font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent-700)">Release to remove</div>
    </sc-if>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 16px;min-height:0">
    <svg ref="{{ svgRef }}" viewBox="0 0 1000 750" onPointerDown="{{ onCanvasDown }}" style="width:100%;max-height:100%;margin:0 auto;display:block;touch-action:none">
      <rect x="0" y="0" width="1000" height="750" fill="#ffffff" stroke="var(--color-divider)" stroke-width="2"></rect>
      <sc-if value="{{ gridOn }}" hint-placeholder-val="{{ false }}">
        <path d="{{ gridPath }}" stroke="#eceae8" stroke-width="1.5" fill="none" style="pointer-events:none"></path>
      </sc-if>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <text x="500" y="382" text-anchor="middle" fill="#cfccc9" font-size="30" font-family="Archivo, sans-serif" style="pointer-events:none">Drag shapes here</text>
      </sc-if>
      <sc-for list="{{ objects }}" as="o" hint-placeholder-count="0">
        <g transform="{{ o.transform }}" opacity="{{ o.dim }}" onPointerDown="{{ o.onDown }}" pointer-events="all" style="cursor:grab">{{ o.inner }}</g>
      </sc-for>
      <sc-if value="{{ marquee }}" hint-placeholder-val="{{ false }}">
        <rect x="{{ marquee.x }}" y="{{ marquee.y }}" width="{{ marquee.w }}" height="{{ marquee.h }}" fill="rgba(236,48,19,0.06)" stroke="var(--color-accent)" stroke-width="2" stroke-dasharray="8 7" style="pointer-events:none"></rect>
      </sc-if>
      <sc-if value="{{ sel }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ sel.outlines }}" as="ol" hint-placeholder-count="0">
          <polygon points="{{ ol.pts }}" fill="none" stroke="var(--color-accent-400)" stroke-width="2.5" style="pointer-events:none"></polygon>
        </sc-for>
        <polygon points="{{ sel.poly }}" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-dasharray="10 8" style="pointer-events:none"></polygon>
        <sc-for list="{{ sel.handles }}" as="h" hint-placeholder-count="0">
          <g>
            <circle cx="{{ h.x }}" cy="{{ h.y }}" r="58" fill="rgba(0,0,0,0)" pointer-events="all" onPointerDown="{{ h.onDown }}" style="cursor:grab;touch-action:none"></circle>
            <circle cx="{{ h.x }}" cy="{{ h.y }}" r="19" fill="#ffffff" stroke="var(--color-accent)" stroke-width="5" style="pointer-events:none"></circle>
          </g>
        </sc-for>
      </sc-if>
      <sc-if value="{{ draft }}" hint-placeholder-val="{{ false }}">
        <path d="{{ draft.d }}" fill="none" stroke="var(--color-accent)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" style="pointer-events:none"></path>
        <sc-for list="{{ draft.guides }}" as="g" hint-placeholder-count="0">
          <g style="pointer-events:none">
            <line x1="{{ g.nx }}" y1="{{ g.ny }}" x2="{{ g.x }}" y2="{{ g.y }}" stroke="var(--color-accent-400)" stroke-width="3"></line>
            <circle cx="{{ g.x }}" cy="{{ g.y }}" r="12" fill="var(--color-accent)"></circle>
          </g>
        </sc-for>
        <sc-for list="{{ draft.nodes }}" as="n" hint-placeholder-count="0">
          <circle cx="{{ n.x }}" cy="{{ n.y }}" r="15" fill="#ffffff" stroke="var(--color-accent)" stroke-width="5" style="pointer-events:none"></circle>
        </sc-for>
        <sc-if value="{{ draft.closeHint }}" hint-placeholder-val="{{ false }}">
          <circle cx="{{ draft.fx }}" cy="{{ draft.fy }}" r="34" fill="rgba(236,48,19,0.12)" stroke="var(--color-accent)" stroke-width="4" style="pointer-events:none"></circle>
        </sc-if>
      </sc-if>
      <sc-if value="{{ edit }}" hint-placeholder-val="{{ false }}">
        <path d="{{ edit.outline }}" fill="none" stroke="var(--color-accent-400)" stroke-width="3" style="pointer-events:none"></path>
        <sc-for list="{{ edit.inserts }}" as="ins" hint-placeholder-count="0">
          <g>
            <circle cx="{{ ins.x }}" cy="{{ ins.y }}" r="46" fill="rgba(0,0,0,0)" pointer-events="all" onPointerDown="{{ ins.onTap }}" style="cursor:pointer;touch-action:none"></circle>
            <circle cx="{{ ins.x }}" cy="{{ ins.y }}" r="15" fill="#ffffff" stroke="var(--color-accent-400)" stroke-width="4" style="pointer-events:none"></circle>
            <path d="{{ ins.plus }}" stroke="var(--color-accent)" stroke-width="4" stroke-linecap="round" style="pointer-events:none"></path>
          </g>
        </sc-for>
        <sc-for list="{{ edit.handles }}" as="h" hint-placeholder-count="0">
          <g>
            <line x1="{{ h.nx }}" y1="{{ h.ny }}" x2="{{ h.x }}" y2="{{ h.y }}" stroke="var(--color-accent)" stroke-width="3" style="pointer-events:none"></line>
            <circle cx="{{ h.x }}" cy="{{ h.y }}" r="56" fill="rgba(0,0,0,0)" pointer-events="all" onPointerDown="{{ h.onDown }}" style="cursor:grab;touch-action:none"></circle>
            <circle cx="{{ h.x }}" cy="{{ h.y }}" r="14" fill="var(--color-accent)" stroke="#ffffff" stroke-width="3" style="pointer-events:none"></circle>
          </g>
        </sc-for>
        <sc-for list="{{ edit.nodes }}" as="n" hint-placeholder-count="0">
          <g>
            <circle cx="{{ n.x }}" cy="{{ n.y }}" r="56" fill="rgba(0,0,0,0)" pointer-events="all" onPointerDown="{{ n.onDown }}" style="cursor:grab;touch-action:none"></circle>
            <circle cx="{{ n.x }}" cy="{{ n.y }}" r="18" fill="{{ n.fill }}" stroke="var(--color-accent)" stroke-width="5" style="pointer-events:none"></circle>
          </g>
        </sc-for>
      </sc-if>
    </svg>
  </div>
  <sc-if value="{{ showPenBar }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--color-divider)">
      <button class="btn btn-ghost" onClick="{{ cancelPen }}" style="flex:none">Cancel</button>
      <button class="btn btn-secondary" onClick="{{ endOpen }}" disabled="{{ cantEnd }}" style="flex:1;justify-content:flex-start">Finish line</button>
      <button class="btn btn-primary" onClick="{{ closePath }}" disabled="{{ cantClose }}" style="flex:1;justify-content:flex-start">Close shape</button>
    </div>
  </sc-if>
  <sc-if value="{{ showEditBar }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--color-divider)">
      <button class="btn btn-secondary" onClick="{{ deleteNode }}" disabled="{{ cantDeleteNode }}" style="flex:1;justify-content:flex-start">Delete point</button>
      <button class="btn btn-primary" onClick="{{ exitEdit }}" style="flex:1;justify-content:flex-start">Done</button>
    </div>
  </sc-if>
  <sc-if value="{{ showActions }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:2px solid var(--color-divider);padding-bottom:env(safe-area-inset-bottom);background:var(--color-bg)">
      <div style="display:flex;gap:1px;background:var(--color-divider)">
        <sc-for list="{{ actions }}" as="a" hint-placeholder-count="3">
          <button onClick="{{ a.onTap }}" disabled="{{ a.disabled }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;background:var(--color-bg);border:none;color:var(--color-text);cursor:pointer;opacity:{{ a.op }}" style-active="background:var(--color-accent-100)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ a.p1 }}"></path><path d="{{ a.p2 }}"></path></svg>
            <span style="font-family:var(--font-heading);font-weight:600;font-size:9px;letter-spacing:0.08em;text-transform:uppercase">{{ a.label }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ showDefaultBar }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--color-divider)">
      <button class="btn btn-secondary" onClick="{{ askClear }}" disabled="{{ empty }}" style="flex:1;justify-content:flex-start">Clear workspace</button>
      <button class="btn btn-primary" onClick="{{ finish }}" disabled="{{ empty }}" style="flex:1;justify-content:flex-start">Finish</button>
    </div>
  </sc-if>
  <sc-if value="{{ colorOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:0;right:0;bottom:0;z-index:55;max-width:560px;margin:0 auto;background:var(--color-surface);border-top:2px solid var(--color-divider);box-shadow:var(--shadow-lg);padding:12px 16px calc(14px + env(safe-area-inset-bottom))">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span style="font-family:var(--font-heading);font-weight:800;font-size:14px">Colour</span>
        <button class="btn btn-ghost" onClick="{{ closeColor }}">Done</button>
      </div>
      <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700);margin:6px 0 6px">Stroke</div>
      <div style="display:flex;gap:8px">
        <sc-for list="{{ strokeSwatches }}" as="s" hint-placeholder-count="8">
          <button onClick="{{ s.onTap }}" aria-label="Stroke colour" style="width:34px;height:34px;flex:none;border:1px solid var(--color-divider);background:{{ s.c }};outline:{{ s.ol }};outline-offset:2px;padding:0;cursor:pointer"></button>
        </sc-for>
      </div>
      <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700);margin:12px 0 6px">Fill</div>
      <div style="display:flex;gap:8px">
        <sc-for list="{{ fillSwatches }}" as="s" hint-placeholder-count="8">
          <button onClick="{{ s.onTap }}" aria-label="Fill colour" style="width:34px;height:34px;flex:none;border:1px solid var(--color-divider);background:{{ s.c }};outline:{{ s.ol }};outline-offset:2px;padding:0;cursor:pointer"></button>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ ghost }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:{{ ghost.x }}px;top:{{ ghost.y }}px;transform:translate(-50%,-55%);pointer-events:none;z-index:50;opacity:0.9;filter:drop-shadow(0 4px 10px rgba(45,43,43,0.3))">
      <svg viewBox="-105 -105 210 210" width="88" height="88"><path d="{{ ghost.d }}" fill="#ffffff" stroke="#201e1d" stroke-width="7" stroke-linejoin="round"></path></svg>
    </div>
  </sc-if>
  <sc-if value="{{ clearConfirm }}" hint-placeholder-val="{{ false }}">
    <div class="dialog-backdrop" style="z-index:60">
      <div class="dialog">
        <div class="dialog-title">Clear workspace?</div>
        <div class="dialog-body">This removes every placed shape. You can undo this afterwards.</div>
        <div class="dialog-actions">
          <button class="btn btn-secondary" onClick="{{ cancelClear }}">Cancel</button>
          <button class="btn btn-primary" onClick="{{ doClear }}">Clear</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:70;background:var(--color-bg);display:flex;flex-direction:column;overflow-y:auto">
      <div style="max-width:560px;width:100%;margin:0 auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px">
        <div>
          <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);font-weight:600;margin-bottom:2px">Exercise complete</div>
          <h2 style="font-size:24px;margin:0">{{ finishTitle }}</h2>
        </div>
        <div role="img" aria-label="Final composition" style="width:100%;aspect-ratio:4/3;border:1px solid var(--color-divider);background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;background-image:{{ exportBg }}"></div>
        <sc-if value="{{ canShare }}" hint-placeholder-val="{{ false }}">
          <button class="btn btn-primary" onClick="{{ sharePng }}" style="justify-content:flex-start;padding-block:12px">Share PNG</button>
        </sc-if>
        <a class="btn btn-secondary" href="{{ exportUrl }}" download="geometry-exercise.png" style="justify-content:flex-start;padding-block:12px">Download PNG</a>
        <p style="font-size:13px;margin:0;color:var(--color-neutral-700);line-height:1.5">{{ shareNote }}</p>
        <hr class="hr" style="margin:2px 0">
        <button class="btn btn-ghost" onClick="{{ backToEdit }}" style="align-self:flex-start">Back to editing</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:860},&quot;showGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Workspace&quot;},&quot;strokeWeight&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:3,&quot;max&quot;:9,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Workspace&quot;,&quot;unit&quot;:&quot;px&quot;}}">
const D = {
  circle:  'M -70 0 A 70 70 0 1 0 70 0 A 70 70 0 1 0 -70 0 Z',
  square:  'M -65 -65 L 65 -65 L 65 65 L -65 65 Z',
  triangle:'M 0 -75 L 80 75 L -80 75 Z'
};
const POLY = {
  circle: Array.from({length:20},(_,i)=>{const a=i/20*2*Math.PI;return [70*Math.cos(a),70*Math.sin(a)];}),
  square: [[-65,-65],[65,-65],[65,65],[-65,65]],
  triangle: [[0,-75],[80,75],[-80,75]]
};
const PALETTE = ['#201e1d','#605d5d','#9b9797','#d7d3d3','#ffffff','#ec3013','#ff9783','#ffc4b8'];
const ICONS = {
  colour: {p1:'M12 2C12 2 5 9.5 5 14a7 7 0 0 0 14 0C19 9.5 12 2 12 2Z', p2:'M14.5 13.5a2.5 2.5 0 0 1-2.5 2.5'},
  points: {p1:'M5 19 19 5', p2:'M3 19h4v4H3zM17 1h4v4h-4z'},
  dup:    {p1:'M9 9h11v11H9Z', p2:'M15 5H5v10'},
  group:  {p1:'M4 4h9v9H4Z', p2:'M11 11h9v9h-9Z'},
  ungroup:{p1:'M3 3h8v8H3Z', p2:'M13 13h8v8h-8Z'},
  del:    {p1:'M3 6h18M8 6V4h8v2', p2:'M6 6l1.2 14h9.6L18 6'}
};
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const app = (past,objs)=>[...past,objs].slice(-60);
const cp = o => JSON.parse(JSON.stringify(o));
const c1of = n => n.h2 ? {x:n.x+n.h2.x, y:n.y+n.h2.y} : {x:n.x, y:n.y};
const c2of = n => n.h1 ? {x:n.x+n.h1.x, y:n.y+n.h1.y} : {x:n.x, y:n.y};
const bez = (a,b,t)=>{
  const p1=c1of(a), p2=c2of(b), u=1-t;
  return {
    x:u*u*u*a.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*b.x,
    y:u*u*u*a.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*b.y
  };
};
const penD = (nodes, closed)=>{
  if(!nodes || !nodes.length) return '';
  const seg=(a,b)=>{
    if(!a.h2 && !b.h1) return ` L ${b.x} ${b.y}`;
    const p1=c1of(a), p2=c2of(b);
    return ` C ${p1.x} ${p1.y} ${p2.x} ${p2.y} ${b.x} ${b.y}`;
  };
  let d=`M ${nodes[0].x} ${nodes[0].y}`;
  for(let i=1;i<nodes.length;i++) d+=seg(nodes[i-1],nodes[i]);
  if(closed && nodes.length>2){ d+=seg(nodes[nodes.length-1],nodes[0]); d+=' Z'; }
  return d;
};
const penPoly = (nodes, closed)=>{
  if(!nodes || !nodes.length) return [[0,0]];
  const n=nodes.length, pts=[];
  const count = closed && n>2 ? n : n-1;
  for(let i=0;i<count;i++){
    const a=nodes[i], b=nodes[(i+1)%n];
    for(let k=0;k<8;k++) { const p=bez(a,b,k/8); pts.push([p.x,p.y]); }
  }
  pts.push([nodes[n-1].x, nodes[n-1].y]);
  return pts;
};
class Component extends DCLogic {
  state = {
    objects:[], past:[], future:[], selIds:[], ghost:null, marquee:null, overTray:false,
    dragging:false, colorOpen:false, clearConfirm:false, finished:false, preparing:false,
    exportUrl:'', canShare:false, shareMsg:'', nextId:1,
    tool:'select', draft:null, live:null, nearClose:false, editId:null, activeNode:null
  };
  svgRef = React.createRef();
  trayRef = React.createRef();
  exportFile = null;
  strokeW(){ return this.props.strokeWeight ?? 5; }
  nid(n=1){ const id=this.state.nextId; this.state.nextId += n; return id; }
  toLocal(cx,cy){ const m=this.svgRef.current.getScreenCTM().inverse(); return {x:m.a*cx+m.c*cy+m.e, y:m.b*cx+m.d*cy+m.f}; }
  toScreen(x,y){ const m=this.svgRef.current.getScreenCTM(); return {x:m.a*x+m.c*y+m.e, y:m.b*x+m.d*y+m.f}; }
  inSvg(cx,cy){ const p=this.toLocal(cx,cy); return p.x>=-40&&p.x<=1040&&p.y>=-40&&p.y<=790; }
  inTray(cx,cy){ const t=this.trayRef.current; if(!t) return false; const r=t.getBoundingClientRect(); return cy>=r.top-6&&cy<=r.bottom+6; }
  windowDrag(move, up){
    const mv = e => { if(e.cancelable) e.preventDefault(); move(e); };
    const done = e => {
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', done);
      window.removeEventListener('pointercancel', done);
      up(e);
    };
    window.addEventListener('pointermove', mv, {passive:false});
    window.addEventListener('pointerup', done);
    window.addEventListener('pointercancel', done);
  }
  push(){ this.setState(s=>({past:app(s.past, cp(s.objects)), future:[]})); }
  // ---- TRS helpers ----
  composeTRS(a, p){
    const rad=a.rot*Math.PI/180, c=Math.cos(rad), s=Math.sin(rad);
    return {x:a.x + (p.x*c - p.y*s)*a.scale, y:a.y + (p.x*s + p.y*c)*a.scale, scale:a.scale*p.scale, rot:a.rot+p.rot};
  }
  toObjLocal(o, wx, wy){
    const rad=-o.rot*Math.PI/180, c=Math.cos(rad), s=Math.sin(rad);
    const dx=(wx-o.x)/o.scale, dy=(wy-o.y)/o.scale;
    return {x:dx*c-dy*s, y:dx*s+dy*c};
  }
  vecToObjLocal(o, wx, wy){
    const rad=-o.rot*Math.PI/180, c=Math.cos(rad), s=Math.sin(rad);
    const dx=wx/o.scale, dy=wy/o.scale;
    return {x:dx*c-dy*s, y:dx*s+dy*c};

  transformPoly(pts, t){
    const rad=t.rot*Math.PI/180, c=Math.cos(rad), s=Math.sin(rad);

    if(o.kind==='pen') return [{d:penD(o.nodes,o.closed), poly:penPoly(o.nodes,o.closed), x:0,y:0,scale:1,rot:0, fill:o.closed?o.fill:'none', stroke:o.stroke}];

  // ---- SVG markup builder (shared by live render and PNG export) ----
  svgInner(o, cum){
    const sw0=this.strokeW();
    const T=p=>`translate(${p.x} ${p.y}) rotate(${p.rot}) scale(${p.scale})`;
    if(o.kind==='shape') return `<path d="${D[o.type]}" fill="${o.fill}" stroke="${o.stroke}" stroke-width="${sw0/cum}" stroke-linejoin="round"/>`;
    if(o.kind==='pen') return `<path d="${penD(o.nodes,o.closed)}" fill="${o.closed?o.fill:'none'}" stroke="${o.stroke}" stroke-width="${sw0/cum}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(o.kind==='group') return o.children.map(ch=>`<g transform="${T(ch)}">${this.svgInner(ch, cum*ch.scale)}</g>`).join('');
    // combined: parts sharing a colour pair merge into one silhouette (outlines first, then fills)
    const path=(p,attrs)=>`<path d="${p.d}" transform="${T(p)}" ${attrs}/>`;
    const swp=p=>sw0/(cum*p.scale);
    const order=[], map={};
    o.parts.forEach(p=>{ const k=p.fill+'|'+p.stroke; if(!map[k]){map[k]=[];order.push(k);} map[k].push(p); });

      return ps.map(p=>path(p,`fill="none" stroke="${st}" stroke-width="${swp(p)*2}" stroke-linejoin="round"`)).join('')

  localBBox(o){
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    this.leafParts(o).forEach(p=>{
      this.transformPoly(p.poly, p).forEach(([x,y])=>{
        if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      });
    });
    if(minx>maxx) return {minx:-10,miny:-10,maxx:10,maxy:10};
    return {minx,miny,maxx,maxy};
  }
  worldCorners(o, pad=0){
    const b=this.localBBox(o), q=pad/o.scale;
    return this.transformPoly([[b.minx-q,b.miny-q],[b.maxx+q,b.miny-q],[b.maxx+q,b.maxy+q],[b.minx-q,b.maxy+q]], o);

  worldAABB(objs, pad=0){
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    objs.forEach(o=>this.worldCorners(o).forEach(([x,y])=>{

    }));

  selObjs(){ return this.state.objects.filter(o=>this.state.selIds.includes(o.id)); }
  leafColors(o){
    if(o.kind==='group') return this.leafColors(o.children[0]);
    if(o.kind==='combined'){ const p=o.parts[0]; return {stroke:p.stroke, fill:p.fill}; }

  }
  recolor(o, which, c){
    if(o.kind==='group') return {...o, children:o.children.map(ch=>this.recolor(ch,which,c))};
    if(o.kind==='combined') return {...o, parts:o.parts.map(p=>({...p,[which]:c}))};

  // ---- tray / object interactions ----

  objDown(id){

  handleDown(){
    return e => {
      e.stopPropagation();

      const single=sel.length===1;

  canvasDown = e => {

    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    poly.forEach(([x,y])=>{ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; });

      objects:[...s.objects, {id, kind:'pen', nodes:local, closed, x:C.x, y:C.y, scale:1, rot:0, stroke:'#201e1d', fill:'#ffffff'}],

      const c=document.createElement('canvas');

      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,2000,1500);
      ctx.drawImage(img,0,0,2000,1500);

    let selVal=null;

      let corners, outlines=[];

      else {
        const b=this.worldAABB(sel,12);
        corners=[[b.minx,b.miny],[b.maxx,b.miny],[b.maxx,b.maxy],[b.minx,b.maxy]];
        outlines=sel.map(o=>({key:o.id, pts:fmt(this.worldCorners(o,5))}));
      }
      selVal={
        poly:fmt(corners),
        outlines,
        handles:corners.map(([x,y])=>({x:x.toFixed(1), y:y.toFixed(1), onDown:this.handleDown()}))
      };
    }
    let actions=[];
    if(sel.length && !editObj && st.tool!=='pen'){
      const A=(key,label,onTap,disabled)=>({key,label,p1:ICONS[key].p1,p2:ICONS[key].p2,onTap,disabled:!!disabled,op:disabled?0.4:1});
      const isGroup=single&&sel[0].kind==='group';
      const isPen=single&&sel[0].kind==='pen';
      actions=[A('colour','Colour',()=>this.setState({colorOpen:!st.colorOpen}))];
      if(isPen) actions.push(A('points','Points',()=>this.setState({editId:sel[0].id, activeNode:null, colorOpen:false})));
      actions.push(A('dup','Duplicate',this.duplicateSel));
      if(sel.length>1) actions.push(A('group','Group',this.groupSel));
      if(isGroup) actions.push(A('ungroup','Ungroup',this.ungroupSel));
      actions.push(A('del','Delete',this.deleteSel));
    }
    const cur=sel.length ? this.leafColors(sel[0]) : {stroke:null,fill:null};
    const swatches=which=>PALETTE.map(c=>({
      c, ol: c===cur[which] ? '2px solid var(--color-accent)' : 'none',
      onTap:()=>this.applyColor(which,c)
    }));
    let gridPath='';
    for(let x=100;x<1000;x+=100) gridPath+=`M ${x} 0 V 750 `;
    for(let y=100;y<750;y+=100) gridPath+=`M 0 ${y} H 1000 `;
    let mq=null;
    if(st.marquee){
      const m=st.marquee;
      mq={x:Math.min(m.x0,m.x1).toFixed(1), y:Math.min(m.y0,m.y1).toFixed(1), w:Math.abs(m.x1-m.x0).toFixed(1), h:Math.abs(m.y1-m.y0).toFixed(1)};
    }
    // pen draft overlay
    let draftVal=null;
    if(st.draft && st.draft.nodes.length){
      const ns=st.draft.nodes;
      const guides=[];
      ns.forEach(n=>{
        if(n.h2) guides.push({key:'a'+guides.length, nx:n.x, ny:n.y, x:n.x+n.h2.x, y:n.y+n.h2.y});
        if(n.h1) guides.push({key:'b'+guides.length, nx:n.x, ny:n.y, x:n.x+n.h1.x, y:n.y+n.h1.y});
      });
      draftVal={
        d:penD(ns,false),
        nodes:ns.map((n,i)=>({key:i, x:n.x, y:n.y})),
        guides,
        closeHint:ns.length>2,
        fx:ns[0].x, fy:ns[0].y
      };
    }
    // pen point editing overlay
    let editVal=null;
    if(editObj){
      const W=(x,y)=>this.composeTRS(editObj,{x,y,scale:1,rot:0});
      const nodes=editObj.nodes.map((n,i)=>{
        const w=W(n.x,n.y);
        return {key:i, x:w.x.toFixed(1), y:w.y.toFixed(1), fill:st.activeNode===i?'var(--color-accent)':'#ffffff', onDown:this.nodeDown(i)};
      });
      let handles=[];
      if(st.activeNode!=null && editObj.nodes[st.activeNode]){
        const n=editObj.nodes[st.activeNode], nw=W(n.x,n.y);
        [['h1',n.h1],['h2',n.h2]].forEach(([k,h])=>{
          const off = h || (k==='h1' ? {x:-55,y:-55} : {x:55,y:55});
          const w=W(n.x+off.x, n.y+off.y);
          handles.push({key:k, nx:nw.x.toFixed(1), ny:nw.y.toFixed(1), x:w.x.toFixed(1), y:w.y.toFixed(1), onDown:this.handleNodeDown(st.activeNode,k)});
        });
      }
      const segs = editObj.closed ? editObj.nodes.length : editObj.nodes.length-1;
      const inserts=[];
      for(let i=0;i<segs;i++){
        const a=editObj.nodes[i], b=editObj.nodes[(i+1)%editObj.nodes.length];
        const m=bez(a,b,0.5), w=W(m.x,m.y);
        inserts.push({key:i, x:w.x.toFixed(1), y:w.y.toFixed(1), plus:`M ${(w.x-7).toFixed(1)} ${w.y.toFixed(1)} H ${(w.x+7).toFixed(1)} M ${w.x.toFixed(1)} ${(w.y-7).toFixed(1)} V ${(w.y+7).toFixed(1)}`, onTap:this.insertNode(i)});
      }
      editVal={outline:penD(editObj.nodes.map((n,i)=>{
        const w=W(n.x,n.y);
        const s=editObj.scale, rad=editObj.rot*Math.PI/180, c=Math.cos(rad), sn=Math.sin(rad);
        const tv=h=>h?{x:(h.x*c-h.y*sn)*s, y:(h.x*sn+h.y*c)*s}:null;
        return {x:w.x, y:w.y, h1:tv(n.h1), h2:tv(n.h2)};
      }), editObj.closed), nodes, handles, inserts};
    }
    const draftLen = st.draft ? st.draft.nodes.length : 0;
    const hint = st.tool==='pen'
        ? (draftLen===0 ? 'Tap to place a point — touch and drag to curve it'
          : draftLen>2 ? 'Tap the first point to close the shape, or finish as a line'
          : 'Keep tapping to extend — drag as you tap to bend the segment')
      : editObj ? 'Drag a point to move it, drag a red handle to bend the curve, tap + to add a point'
      : st.dragging ? 'Drag onto the tray to remove'
      : st.marquee ? 'Release to select the shapes inside'
      : st.ghost ? 'Release over the workspace to place'
      : sel.length>1 ? 'Tap a shape to add or remove it from the selection'
      : single ? 'Drag a corner — pull to resize, arc around the shape to rotate'
      : 'Drag a shape in, draw with the pen, or drag across empty space to select';
    const penActive = st.tool==='pen';
    return {
      trayRef:this.trayRef, svgRef:this.svgRef,
      tiles:['circle','square','triangle'].map(t=>({key:t, d:D[t], onDown:this.tileDown(t)})),
      togglePen:this.togglePen,
      penTileBg: penActive ? 'var(--color-accent)' : 'var(--color-neutral-100)',
      penTileBorder: penActive ? 'var(--color-accent)' : 'var(--color-divider)',
      penTileFg: penActive ? '#ffffff' : 'var(--color-text)',
      objects: st.objects.map(o=>({
        key:o.id,
        transform:`translate(${o.x} ${o.y}) rotate(${o.rot}) scale(${o.scale})`,
        dim:(st.overTray && st.selIds.includes(o.id)) ? 0.35 : 1,
        onDown:this.objDown(o.id),
        inner:React.createElement('g', {dangerouslySetInnerHTML:{__html:this.svgInner(o, o.scale)}})
      })),
      sel:selVal, actions, marquee:mq, draft:draftVal, edit:editVal,
      strokeSwatches:swatches('stroke'), fillSwatches:swatches('fill'),
      colorOpen:st.colorOpen && sel.length>0,
      ghost: st.ghost ? {x:st.ghost.x, y:st.ghost.y, d:D[st.ghost.type]} : null,
      overTray:st.overTray,
      empty:st.objects.length===0,
      showPenBar:penActive,
      showEditBar:!!editObj,
      showActions: !!(sel.length && !editObj && !penActive),
      showDefaultBar: !sel.length && !editObj && !penActive,
      cantEnd: draftLen<2,
      cantClose: draftLen<3,
      cantDeleteNode: !(editObj && st.activeNode!=null && editObj.nodes.length > (editObj.closed?3:2)),
      noUndo: st.draft ? draftLen===0 : st.past.length===0,
      noRedo: !!st.draft || st.future.length===0,
      undo:this.undo, redo:this.redo,
      gridOn:(this.props.showGrid ?? true),
      gridPath, hint,
      clearConfirm:st.clearConfirm,
      finished:st.finished,
      finishTitle: st.preparing ? 'Preparing your PNG…' : 'Your composition is ready',
      canShare: st.canShare && !st.preparing,
      shareNote: st.canShare
        ? 'Share sends the PNG straight to any app on your phone. You can also download it and upload it to the Padlet link provided.'
        : 'Save the PNG to your device, then upload it to the Padlet link provided by the researcher.',
      exportUrl:st.exportUrl,
      exportBg: st.exportUrl ? `url("${st.exportUrl}")` : 'none',
      sharePng:this.sharePng,
      onCanvasDown:this.canvasDown,
      cancelPen:this.cancelPen,
      endOpen:()=>this.commitPen(false),
      closePath:()=>this.commitPen(true),
      deleteNode:this.deleteNode,
      exitEdit:()=>this.setState({editId:null, activeNode:null}),
      askClear:()=>this.setState({clearConfirm:true}),
      cancelClear:()=>this.setState({clearConfirm:false}),
      doClear:()=>this.setState(s=>({past:app(s.past,cp(s.objects)), future:[], objects:[], selIds:[], clearConfirm:false, colorOpen:false, editId:null})),
      finish:this.finishExercise,
      closeColor:()=>this.setState({colorOpen:false}),
      backToEdit:()=>this.setState({finished:false, preparing:false})
    };
  }
}
</script>
